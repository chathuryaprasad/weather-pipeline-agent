# Docker Compose for running only the AI Agent (without orchestrator)
version: '3.8'
services:
  db:
    image: mysql:8
    container_name: adup_task_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: weather_db
    ports:
      - "3036:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mysql_data:/var/lib/mysql

  agent:
    build: .
    container_name: adup_task_agent
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      STORAGE_TYPE: mysql
      MYSQL_HOST: db
      MYSQL_PORT: 3036
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: weather_db
      MYSQL_TABLE: weather_data
    stdin_open: true
    tty: true
    command: ["sh", "-c", "chmod +x docker/startup_agent.sh && docker/startup_agent.sh"]
    restart: unless-stopped

volumes:
  mysql_data:

