# Docker Compose for running only the AI Agent (without orchestrator)
version: '3.8'
services:
  db:
    image: mysql:8
    container_name: adup_task_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
    ports:
      - "${MYSQL_CONTAINER_PORT}:${MYSQL_PORT}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mysql_data:/var/lib/mysql

  agent:
    build: .
    container_name: adup_task_agent
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      STORAGE_TYPE: ${STORAGE_TYPE}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_TABLE: ${MYSQL_TABLE}
    stdin_open: true
    tty: true
    command: ["sh", "-c", "chmod +x docker/startup_agent.sh && docker/startup_agent.sh"]
    restart: unless-stopped

volumes:
  mysql_data:

