version: '3.8'
services:
  db:
    image: mysql:8
    container_name: adup_task_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
    ports:
      - "${MYSQL_CONTAINER_PORT}:${MYSQL_PORT}"  # External port 3036 maps to internal 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s  # Give MySQL time to initialize

  app:
    build: .
    container_name: adup_task_app
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Override a few defaults for docker compose
      STORAGE_TYPE: ${STORAGE_TYPE}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_TABLE: ${MYSQL_TABLE}
      BACKFILL_DAYS: ${BACKFILL_DAYS}
    command: ["sh", "-c", "chmod +x docker/startup.sh && docker/startup.sh"]
    restart: unless-stopped

  api:
    build: .
    container_name: adup_task_api
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    env_file: .env
    environment:
      STORAGE_TYPE: ${STORAGE_TYPE}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_TABLE: ${MYSQL_TABLE}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN}
    ports:
      - "8000:8000"
    command: ["sh", "-c", "chmod +x docker/startup_api.sh && docker/startup_api.sh"]
    restart: unless-stopped

  agent:
    build: .
    container_name: adup_task_agent
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    env_file: .env
    environment:
      STORAGE_TYPE: ${STORAGE_TYPE}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_TABLE: ${MYSQL_TABLE}
    stdin_open: true
    tty: true
    command: ["sh", "-c", "chmod +x docker/startup_agent.sh && docker/startup_agent.sh"]
    restart: unless-stopped

volumes:
  mysql_data:
